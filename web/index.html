<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>連続対局・定跡生成</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="app">makebook-gui</span>
        <h1 id="title">連続対局・定跡生成</h1>
      </div>
      <div class="tally" id="tally"></div>
      <div class="conn" id="conn">
        <span class="dot"></span><span id="conn-text">観戦データを取得中…</span>
      </div>
    </header>

    <main>
      <section class="stage">
        <nav class="games" id="games" aria-label="観戦する対局"></nav>

        <div class="review" id="review" hidden>
          <span class="review-label">ツリーの局面を表示中</span>
          <span class="review-move" id="review-move"></span>
          <button class="btn btn-accent" id="back-live">
            観戦に戻る<kbd>Esc</kbd>
          </button>
        </div>

        <div class="board-wrap" id="board-wrap">
          <canvas id="board"></canvas>
        </div>

        <div class="caption">
          <div class="caption-main">
            <div class="now" id="now">—</div>
            <div class="recent" id="recent"></div>
          </div>
          <button
            class="btn btn-ghost"
            id="copy"
            title="この局面までの手順をUSIの position 形式でコピー"
          >
            USIをコピー
          </button>
          <button
            class="btn btn-ghost"
            id="precedent"
            title="この局面までの手順付きでKiriCompassの前例を開く"
          >
            前例
          </button>
        </div>

        <div class="notice" id="notice" hidden></div>
      </section>

      <section class="treepane">
        <div class="task" id="task">
          <button class="task-thumb" id="task-thumb" title="課題局面を盤に表示">
            <canvas id="task-board"></canvas>
          </button>
          <div class="task-body">
            <div class="task-top">
              <span class="task-no" id="task-no">課題</span>
              <span class="task-state" id="task-state"></span>
              <span class="task-pos" id="task-pos"></span>
              <button class="btn btn-small" id="task-sfen" disabled>
                課題の棋譜
              </button>
              <button
                class="btn btn-small"
                id="all-sfen"
                disabled
                title="全課題の完了棋譜をSFENで保存"
              >
                全課題の棋譜 (SFEN) 0局
              </button>
              <a class="btn btn-small" href="/book.db" download>定跡DB</a>
            </div>
            <div class="task-name" id="task-name">—</div>
            <div class="task-comment" id="task-comment"></div>
            <div class="task-stats" id="task-stats"></div>
            <div class="task-list" id="task-list" aria-label="課題一覧"></div>
          </div>
        </div>
        <div class="tree-head">
          <div class="tree-title">
            <div
              class="seg"
              id="scope"
              role="tablist"
              aria-label="ツリーの範囲"
            >
              <button data-v="full">全体ツリー</button>
              <button data-v="task" id="scope-task">課題の対局</button>
            </div>
            <span class="meta" id="tree-meta"></span>
            <span
              class="meta"
              id="task-tree-loading"
              role="status"
              hidden
            ></span>
            <button class="btn btn-small" id="tree-sfen" hidden>
              課題の棋譜
            </button>
          </div>
          <div class="tree-tools">
            <label class="switch" title="対局の現在位置へ自動でスクロール">
              <input type="checkbox" id="follow" checked /><span class="track"
                ><span class="knob"></span></span
              >自動スクロール
            </label>
            <button class="btn btn-ghost" id="to-live">現在局面へ</button>
            <div class="zoom">
              <button class="btn btn-icon" id="zoom-out" aria-label="縮小">
                −
              </button>
              <span id="zoom-value">100%</span>
              <button class="btn btn-icon" id="zoom-in" aria-label="拡大">
                ＋
              </button>
            </div>
            <div
              class="tree-fold"
              id="task-tree-fold"
              role="group"
              aria-label="課題の枝を開閉"
              hidden
            >
              <select
                class="btn"
                id="fold-limit"
                aria-label="閉じる対象の前例数"
              >
                <option value="root10" selected>ルートの10％以下</option>
                <option value="1">1局以下</option>
                <option value="3">3局以下</option>
                <option value="5">5局以下</option>
                <option value="10">10局以下</option>
                <option value="20">20局以下</option>
              </select>
              <button
                class="btn"
                id="fold-rare"
                title="選択中と進行中の各対局への経路を残し、指定局数以下の枝を閉じる"
              >
                閉じる
              </button>
              <button
                class="btn"
                id="open-all-task"
                title="この課題の枝を全部開く"
              >
                全部開く
              </button>
            </div>
          </div>
        </div>
        <div class="tree-wrap" id="tree-wrap">
          <canvas id="tree" tabindex="0"></canvas>
          <div class="hint">
            ドラッグ・スクロールで移動　ピンチ／⌘＋スクロールで拡縮　ダブルクリックで開閉　←→↑↓で手を移動
          </div>
        </div>
        <div class="detail" id="detail">
          <div class="detail-node">
            <div class="detail-head" id="detail-head">—</div>
            <div class="detail-tags" id="detail-tags"></div>
            <div class="detail-comment" id="detail-comment"></div>
          </div>
          <div class="detail-next">
            <div class="detail-sub">次の手</div>
            <ol class="next-list" id="next-list"></ol>
          </div>
        </div>
      </section>
    </main>
    <div class="toast" id="toast" hidden></div>
    <script src="/app.js" defer></script>
    <script src="/tasks.js" defer></script>
    <script src="/connect.js" defer></script>
  </body>
</html>
